{% set accent = card_accent if card_accent else 'indigo' %}
<a href="/anime/{{ anime.slug if anime.slug else anime.id }}"
    class="group relative flex flex-col rounded-2xl pb-4 hover:-translate-y-2 transition-all duration-300">
    <div class="relative aspect-[2/3] overflow-hidden rounded-2xl shadow-lg shadow-black/40 bg-slate-900">
        <img src="{{ anime.poster_url }}" onerror="this.onerror=null; this.src='/static/no-poster.jpg';"
            alt="{{ anime.title }}"
            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
        <div
            class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent opacity-60 group-hover:opacity-80 transition-opacity">
        </div>

        <div
            class="absolute top-3 left-3 bg-{{ accent }}-600/90 backdrop-blur-md text-white text-[10px] font-bold px-2 py-1 rounded-md border border-white/10 flex items-center gap-1 shadow-md z-10">
            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                <path
                    d="M2 6a2 2 0 012-2h12a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zM14.553 7.106A1 1 0 0013 8v4a1 1 0 001.553.894l2-1a1 1 0 000-1.788l-2-1z">
                </path>
            </svg>
            {{ anime.episodes_count }} эп.
        </div>

        <div
            class="absolute top-3 right-3 bg-slate-900/90 backdrop-blur-md text-yellow-400 text-xs font-bold px-2 py-1 rounded-lg border border-white/10 flex items-center gap-1 z-10 shadow-md">
            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                <path
                    d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z">
                </path>
            </svg>
            {{ anime.rating_shikimori }}
        </div>

        {% if anime.updated_at %}
        <div
            class="absolute bottom-3 right-3 bg-black/60 backdrop-blur-md text-gray-200 text-[10px] font-medium px-2 py-1 rounded-md border border-white/10 z-10">
            {{ anime.updated_at | timeago }}
        </div>
        {% endif %}
    </div>

    <div class="mt-3 px-1">
        <h3 class="text-sm md:text-base font-bold text-white group-hover:text-{{ accent }}-400 transition-colors">
            {{ anime.title }}
        </h3>
        <div class="text-xs text-slate-500 mt-1 leading-normal font-semibold tracking-wide">
            {{ anime.year }} {{ anime.type | translate_type }}
        </div>
    </div>
</a>
